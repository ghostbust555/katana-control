[workspace]
resolver = "3"
members = ["crates/katana-core", "crates/katana-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0.104"
midir = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
katana-core = { path = "crates/katana-core" }
