[package]
name = "katana-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "katana-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
katana-core.workspace = true
# custom-protocol: serve the bundled UI from the exe (the tauri CLI adds it for release builds;
# we build with cargo directly, so enable it here).
tauri = { version = "2", features = ["custom-protocol"] }
# AI Studio web tools. rustls: no OpenSSL or system TLS needed when cross-compiling.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
url = "2"
